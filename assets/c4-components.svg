<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1090" role="img" aria-label="mcl-citizens components">
<title>mcl-citizens components</title>
<style>
.t-name { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; }
.t-desc { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12.5px; }
.t-rel { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 11.5px; paint-order: stroke; stroke-width: 4px; stroke-linejoin: round; }
.t-code { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
.t-type { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; }
.t-bound { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
.t-leg { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12px; }
.edge { fill: none; stroke-width: 1.25; }
.edge-later { fill: none; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bg { fill: #FFFFFF; }
.b-sys { fill: #F5E9CC; stroke: #A56F0A; stroke-width: 2; }
.b-per { fill: #E3EBF2; stroke: #3B5B7A; stroke-width: 1.25; }
.b-mac { fill: #E6E4EE; stroke: #5E5A78; stroke-width: 1.25; }
.b-ext { fill: #ECEFED; stroke: #8A9791; stroke-width: 1.25; }
.b-cmp { fill: #FFFFFF; stroke: #8A9791; stroke-width: 1.25; }
.b-later { fill: none; stroke: #8A9791; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bound { fill: none; stroke: #B3BDB8; stroke-width: 1; }
.head { fill: #3B5B7A; }
.t-name, .t-code { fill: #16201D; }
.t-type, .t-bound, .t-leg { fill: #66736E; }
.t-desc { fill: #34413C; }
.t-rel { fill: #66736E; stroke: #FFFFFF; }
.edge, .edge-later { stroke: #8A9791; }
.arrowhead { fill: #8A9791; }
@media (prefers-color-scheme: dark) {
.bg { fill: #171F1C; }
.b-sys { fill: #3A2E13; stroke: #E3AA3C; }
.b-per { fill: #1D2A36; stroke: #8EB4D8; }
.b-mac { fill: #26243A; stroke: #A9A4C8; }
.b-ext { fill: #1C2421; stroke: #7D8B85; }
.b-cmp { fill: #171F1C; stroke: #7D8B85; }
.b-later { stroke: #7D8B85; }
.bound { stroke: #4A5752; }
.head { fill: #8EB4D8; }
.t-name, .t-code { fill: #E6ECE9; }
.t-type, .t-bound, .t-leg { fill: #93A09A; }
.t-desc { fill: #C3CDC8; }
.t-rel { fill: #93A09A; stroke: #171F1C; }
.edge, .edge-later { stroke: #7D8B85; }
.arrowhead { fill: #7D8B85; }
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1000" height="1090"/>
<rect class="bound" x="16" y="40" width="968" height="800" rx="12"/>
<text class="t-bound" x="32" y="62">mcl-citizens [Container]</text>
<rect class="b-mac" x="32" y="70" width="456" height="110" rx="10"/>
<text class="t-code" x="48" y="98">mcl_om</text>
<text class="t-type" x="48" y="116">[library, ~&gt; 1.4]</text>
<text class="t-desc" x="48" y="140">boot/1: loads the node identity key, joins the realm, dials the</text>
<text class="t-desc" x="48" y="156">stations, registers the declared capabilities, serves /health</text>
<rect class="b-mac" x="512" y="70" width="456" height="110" rx="10"/>
<text class="t-code" x="528" y="98">macula SDK</text>
<text class="t-type" x="528" y="116">[library, ~&gt; 16.0, wire 1.0]</text>
<text class="t-desc" x="528" y="140">QUIC transport, signed calls (the caller's node id, verified before</text>
<text class="t-desc" x="528" y="156">the handler runs), fact topics and the node keys behind the list</text>
<rect class="b-sys" x="32" y="210" width="456" height="140" rx="10"/>
<text class="t-code" x="48" y="238">mcl_citizens_service</text>
<text class="t-type" x="48" y="256">[mcl_om_service behaviour]</text>
<text class="t-desc" x="48" y="280">The six callbacks mcl_om resolves by name at startup:</text>
<text class="t-desc" x="48" y="296">register_presence, list_citizens and get_citizen are</text>
<text class="t-desc" x="48" y="312">its own procedures; mcl_om adds open info and</text>
<text class="t-desc" x="48" y="328">get_limits. capabilities/0 is the list. No store.</text>
<rect class="b-cmp" x="512" y="210" width="456" height="130" rx="10"/>
<text class="t-code" x="528" y="238">mcl_citizens_sup</text>
<text class="t-type" x="528" y="256">[supervisor, rest_for_one]</text>
<text class="t-desc" x="528" y="280">citizen_directory, then hear_citizen_presence. A directory restart</text>
<text class="t-desc" x="528" y="296">empties the table, and the listener restarts behind it so nothing is</text>
<text class="t-desc" x="528" y="312">admitted into a table that is about to vanish</text>
<rect class="b-sys" x="32" y="370" width="456" height="140" rx="10"/>
<text class="t-code" x="48" y="398">register_presence_responder</text>
<text class="t-type" x="48" y="416">[macula_response RPC provider]</text>
<text class="t-desc" x="48" y="440">handle_request/2 reads the caller macula verified and refuses a</text>
<text class="t-desc" x="48" y="456">citizen_did that names anyone else; bounds ttl_ms to 20 min, stamps</text>
<text class="t-desc" x="48" y="472">registered_at from this instance's clock, writes through the one</text>
<text class="t-desc" x="48" y="488">policy, then publishes the registration</text>
<rect class="b-cmp" x="512" y="370" width="456" height="140" rx="10"/>
<text class="t-code" x="528" y="398">hear_citizen_presence</text>
<text class="t-type" x="528" y="416">[gen_server, federation listener]</text>
<text class="t-desc" x="528" y="440">Subscribes to citizen_presence_registered_v1. A fact is taken only</text>
<text class="t-desc" x="528" y="456">when macula verified its publisher and the node id is in</text>
<text class="t-desc" x="528" y="472">MCL_CITIZENS_PRESENCE_PUBLISHERS. Re-subscribes every 5 s while the</text>
<text class="t-desc" x="528" y="488">mesh is dark and counts what it drops, logged once a minute</text>
<rect class="b-cmp" x="32" y="534" width="456" height="140" rx="10"/>
<text class="t-code" x="48" y="562">mcl_citizens_facts + citizen_did</text>
<text class="t-type" x="48" y="580">[topics and the citizen id]</text>
<text class="t-desc" x="48" y="604">presence_topic/1: &lt;realm&gt;/mcl-citizens/citizens/directory/</text>
<text class="t-desc" x="48" y="620">citizen_presence_registered_v1. Checks sha256(MCL_REALM_NAME) ==</text>
<text class="t-desc" x="48" y="636">MCL_REALM at start. citizen_did parses and hex-encodes a DID, so a</text>
<text class="t-desc" x="48" y="652">raw 32-byte id never reaches a reply or a fact</text>
<rect class="b-sys" x="512" y="534" width="456" height="140" rx="10"/>
<text class="t-code" x="528" y="562">on_citizen_presence_maybe_admit</text>
<text class="t-type" x="528" y="580">[the one admission policy]</text>
<text class="t-desc" x="528" y="604">One code path for an own registration and a federated fact. Expiry</text>
<text class="t-desc" x="528" y="620">is registered_at + ttl_ms, capped at 20 min from this clock; a stamp</text>
<text class="t-desc" x="528" y="636">60 s ahead is refused. The latest registered_at wins, and an older</text>
<text class="t-desc" x="528" y="652">replay replaces nothing</text>
<rect class="b-cmp" x="32" y="698" width="456" height="120" rx="10"/>
<text class="t-code" x="48" y="726">list_citizens + get_citizen responders</text>
<text class="t-type" x="48" y="744">[macula_response RPC providers]</text>
<text class="t-desc" x="48" y="768">list_citizens answers every live entry; get_citizen takes a 64-hex</text>
<text class="t-desc" x="48" y="784">citizen_did. Both read the ETS table directly, and an expired</text>
<text class="t-desc" x="48" y="800">entry is invisible at read time</text>
<rect class="b-cmp" x="512" y="698" width="456" height="120" rx="10"/>
<text class="t-code" x="528" y="726">citizen_directory</text>
<text class="t-type" x="528" y="744">[gen_server over ETS]</text>
<text class="t-desc" x="528" y="768">Every write goes through admit/2, which compares against the live</text>
<text class="t-desc" x="528" y="784">entry and decides, so two registrations cannot both win. sweep/0</text>
<text class="t-desc" x="528" y="800">removes expired entries every 60 s, keeping memory bounded</text>
<rect class="b-ext" x="32" y="870" width="936" height="108" rx="10"/>
<text class="t-name" x="48" y="898">host environment</text>
<text class="t-type" x="48" y="916">[environment, from the host; the container holds only the identity key]</text>
<text class="t-desc" x="48" y="940">MCL_REALM, MCL_REALM_KEY, MACULA_STATION_SEEDS, MACULA_STATION_NODE_IDS, MCL_CITIZENS_PRESENCE_PUBLISHERS,</text>
<text class="t-desc" x="48" y="956">MCL_REALM_NAME and the boot claim's MCL_SERVICE_NAME and MCL_BOX. deploy/docker-compose.yml refuses to start without the required ones</text>
<path class="edge" d="M488 125H512" marker-end="url(#a)"/>
<text class="t-rel" x="500" y="62" text-anchor="middle">calls</text>
<path class="edge" d="M260 180V210" marker-end="url(#a)"/>
<text class="t-rel" x="268" y="204">boots through mcl_om:boot/1</text>
<path class="edge" d="M488 275H512" marker-end="url(#a)"/>
<text class="t-rel" x="500" y="268" text-anchor="middle" transform="rotate(-90 500 268)">starts</text>
<path class="edge" d="M740 340V370" marker-end="url(#a)"/>
<text class="t-rel" x="748" y="364">supervises</text>
<path class="edge" d="M260 510V534" marker-end="url(#a)"/>
<text class="t-rel" x="268" y="528">publishes each registration</text>
<path class="edge" d="M740 510V534" marker-end="url(#a)"/>
<text class="t-rel" x="748" y="528">a listed instance only</text>
<path class="edge" d="M488 440H500V604H512" marker-end="url(#a)"/>
<text class="t-rel" x="506" y="524">hands it over</text>
<path class="edge" d="M740 674V698" marker-end="url(#a)"/>
<text class="t-rel" x="748" y="692">admit/2, one writer</text>
<path class="edge" d="M488 758H512" marker-end="url(#a)"/>
<text class="t-rel" x="500" y="690" text-anchor="middle">reads the directory</text>
<text class="t-desc" x="40" y="1006">config/sys.config.src fixes the org, mcl-citizens, which prefixes its own procedures; it also pins the realm key.</text>
<text class="t-desc" x="40" y="1022">deploy/docker-compose.yml mounts only the identity volume: nothing here writes to disk, so there is no data volume to lose.</text>
<rect class="b-sys" x="24" y="1052" width="22" height="14" rx="3"/>
<text class="t-leg" x="54" y="1064">In scope</text>
<rect class="b-per" x="110.8" y="1052" width="22" height="14" rx="3"/>
<text class="t-leg" x="140.8" y="1064">Person</text>
<rect class="b-mac" x="184.39999999999998" y="1052" width="22" height="14" rx="3"/>
<text class="t-leg" x="214.39999999999998" y="1064">Macula infrastructure</text>
<rect class="b-ext" x="357.0" y="1052" width="22" height="14" rx="3"/>
<text class="t-leg" x="387.0" y="1064">External system</text>
<rect class="b-cmp" x="490.0" y="1052" width="22" height="14" rx="3"/>
<text class="t-leg" x="520.0" y="1064">Container or component</text>
</svg>
