<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" role="img" aria-label="mcl-citizens system context">
<title>mcl-citizens system context</title>
<style>
.t-name { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; }
.t-desc { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12.5px; }
.t-rel { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 11.5px; paint-order: stroke; stroke-width: 4px; stroke-linejoin: round; }
.t-code { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
.t-type { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; }
.t-bound { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
.t-leg { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12px; }
.edge { fill: none; stroke-width: 1.25; }
.edge-later { fill: none; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bg { fill: #FFFFFF; }
.b-sys { fill: #F5E9CC; stroke: #A56F0A; stroke-width: 2; }
.b-per { fill: #E3EBF2; stroke: #3B5B7A; stroke-width: 1.25; }
.b-mac { fill: #E6E4EE; stroke: #5E5A78; stroke-width: 1.25; }
.b-ext { fill: #ECEFED; stroke: #8A9791; stroke-width: 1.25; }
.b-cmp { fill: #FFFFFF; stroke: #8A9791; stroke-width: 1.25; }
.b-later { fill: none; stroke: #8A9791; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bound { fill: none; stroke: #B3BDB8; stroke-width: 1; }
.head { fill: #3B5B7A; }
.t-name, .t-code { fill: #16201D; }
.t-type, .t-bound, .t-leg { fill: #66736E; }
.t-desc { fill: #34413C; }
.t-rel { fill: #66736E; stroke: #FFFFFF; }
.edge, .edge-later { stroke: #8A9791; }
.arrowhead { fill: #8A9791; }
@media (prefers-color-scheme: dark) {
.bg { fill: #171F1C; }
.b-sys { fill: #3A2E13; stroke: #E3AA3C; }
.b-per { fill: #1D2A36; stroke: #8EB4D8; }
.b-mac { fill: #26243A; stroke: #A9A4C8; }
.b-ext { fill: #1C2421; stroke: #7D8B85; }
.b-cmp { fill: #171F1C; stroke: #7D8B85; }
.b-later { stroke: #7D8B85; }
.bound { stroke: #4A5752; }
.head { fill: #8EB4D8; }
.t-name, .t-code { fill: #E6ECE9; }
.t-type, .t-bound, .t-leg { fill: #93A09A; }
.t-desc { fill: #C3CDC8; }
.t-rel { fill: #93A09A; stroke: #171F1C; }
.edge, .edge-later { stroke: #7D8B85; }
.arrowhead { fill: #7D8B85; }
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1000" height="690"/>
<rect class="b-per" x="40" y="30" width="280" height="120" rx="10"/>
<circle class="head" cx="66" cy="54" r="9"/>
<text class="t-name" x="84" y="58">Citizen</text>
<text class="t-type" x="84" y="76">[Person]</text>
<text class="t-desc" x="56" y="100">An agent, or the operator of a node,</text>
<text class="t-desc" x="56" y="116">that registers itself and reads the</text>
<text class="t-desc" x="56" y="132">directory</text>
<rect class="b-per" x="690" y="30" width="270" height="120" rx="10"/>
<circle class="head" cx="716" cy="54" r="9"/>
<text class="t-name" x="734" y="58">Service operator</text>
<text class="t-type" x="734" y="76">[Person]</text>
<text class="t-desc" x="706" y="100">Deploys the release and supplies</text>
<text class="t-desc" x="706" y="116">the realm, the stations and the</text>
<text class="t-desc" x="706" y="132">instance list</text>
<rect class="b-sys" x="365" y="200" width="270" height="152" rx="10"/>
<text class="t-name" x="381" y="228">mcl-citizens</text>
<text class="t-type" x="381" y="246">[mcl_om mesh service, own box]</text>
<text class="t-desc" x="381" y="270">Three open procedures:</text>
<text class="t-desc" x="381" y="286">register_presence, list_citizens</text>
<text class="t-desc" x="381" y="302">and get_citizen. /health is a Unix</text>
<text class="t-desc" x="381" y="318">socket; the directory is in memory</text>
<text class="t-desc" x="381" y="334">and nothing is written to disk</text>
<rect class="b-ext" x="365" y="420" width="270" height="136" rx="10"/>
<text class="t-name" x="381" y="448">Other mcl-citizens instances</text>
<text class="t-type" x="381" y="466">[External: federation peers]</text>
<text class="t-desc" x="381" y="490">Each registration is a fact on</text>
<text class="t-desc" x="381" y="506">the directory topic. A peer is</text>
<text class="t-desc" x="381" y="522">heard only when its node id is in</text>
<text class="t-desc" x="381" y="538">the configured publisher list</text>
<rect class="b-mac" x="40" y="420" width="280" height="120" rx="10"/>
<text class="t-name" x="56" y="448">macula-realm</text>
<text class="t-type" x="56" y="466">[Macula infrastructure]</text>
<text class="t-desc" x="56" y="490">Endorses the node's identity key</text>
<text class="t-desc" x="56" y="506">and grants the org mcl-citizens,</text>
<text class="t-desc" x="56" y="522">whose procedures it advertises</text>
<rect class="b-mac" x="680" y="420" width="280" height="120" rx="10"/>
<text class="t-name" x="696" y="448">Macula stations, mesh DHT</text>
<text class="t-type" x="696" y="466">[Macula infrastructure]</text>
<text class="t-desc" x="696" y="490">The pinned stations are its mesh</text>
<text class="t-desc" x="696" y="506">entry points (QUIC); the DHT takes</text>
<text class="t-desc" x="696" y="522">the capabilities it advertises</text>
<path class="edge" d="M180 150V180H400V200" marker-end="url(#a)"/>
<text class="t-rel" x="200" y="160">calls register_presence,</text>
<text class="t-rel" x="200" y="176">list_citizens, get_citizen</text>
<path class="edge" d="M825 150V180H620V200" marker-end="url(#a)"/>
<text class="t-rel" x="640" y="160">deploys; supplies the realm,</text>
<text class="t-rel" x="640" y="176">stations and instance list</text>
<path class="edge" d="M420 352V380H180V420" marker-end="url(#a)"/>
<text class="t-rel" x="300" y="372">boot claim, org grant</text>
<path class="edge" d="M600 352V380H820V420" marker-end="url(#a)"/>
<text class="t-rel" x="800" y="356" text-anchor="end">dials pinned; advertises</text>
<text class="t-rel" x="800" y="372" text-anchor="end">each procedure</text>
<path class="edge" d="M460 352V420" marker-end="url(#a)"/>
<text class="t-rel" x="452" y="386" text-anchor="end">publishes each registration</text>
<path class="edge" d="M540 420V352" marker-end="url(#a)"/>
<text class="t-rel" x="548" y="386">only a listed publisher is heard</text>
<text class="t-desc" x="40" y="574">Nothing is written to disk: the directory is soft state, empty after a restart for at most one republish interval,</text>
<text class="t-desc" x="40" y="592">and refilled by the clients' own re-registrations and the peers' facts. A citizen registers itself and nobody else,</text>
<text class="t-desc" x="40" y="610">because macula verifies the caller's signature before the handler runs; a citizen_did naming anyone else is refused.</text>
<rect class="b-sys" x="24" y="650" width="22" height="14" rx="3"/>
<text class="t-leg" x="54" y="662">In scope</text>
<rect class="b-per" x="110.8" y="650" width="22" height="14" rx="3"/>
<text class="t-leg" x="140.8" y="662">Person</text>
<rect class="b-mac" x="184.39999999999998" y="650" width="22" height="14" rx="3"/>
<text class="t-leg" x="214.39999999999998" y="662">Macula infrastructure</text>
<rect class="b-ext" x="357.0" y="650" width="22" height="14" rx="3"/>
<text class="t-leg" x="387.0" y="662">External system</text>
<rect class="b-cmp" x="490.0" y="650" width="22" height="14" rx="3"/>
<text class="t-leg" x="520.0" y="662">Container or component</text>
</svg>
